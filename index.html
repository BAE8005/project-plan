<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #d5d5d5; height: 100%; }
  body { font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
  input, textarea, select { font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
  .phw-card:hover { transform: translateY(-2px); box-shadow: 3px 4px 0 rgba(0,0,0,0.12); }
  .phw-btn:active { transform: scale(0.97); }
  .phw-btn:disabled { opacity: 0.6; cursor: default; }
  @media (max-width: 720px) {
    .phw-page { padding: 12px !important; }
    .phw-content-row { flex-direction: column !important; }
    .phw-cal-widget { width: 100% !important; position: static !important; align-self: stretch !important; box-sizing: border-box !important; }
    .phw-sidebar { width: 100% !important; position: static !important; }
    .phw-sidebar-right { width: 100% !important; }
    .phw-board { display: flex !important; overflow-x: auto !important; }
    .phw-column { min-width: 148px !important; width: 148px !important; flex-shrink: 0 !important; }
    .phw-header-row { gap: 8px !important; }
    .phw-stat-group { gap: 6px !important; flex-wrap: wrap !important; }
    .phw-stat-box { min-width: 50px !important; padding: 6px 8px !important; }
  }
  @media (max-width: 720px) and (orientation: portrait) {
    .phw-page { height: auto !important; overflow: visible !important; }
    .phw-content-row { flex: none !important; min-height: 0 !important; }
    .phw-main-col { height: auto !important; overflow: visible !important; }
    .phw-column-header { position: static !important; }
  }
</style>
